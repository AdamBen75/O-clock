<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>O'clock — Minuteur / Chrono / Réveil / Horloge</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <main class="container">
      <h1>O'clock</h1>

      <section id="clock" class="card">
        <h2>Horloge (heure française)</h2>
        <div class="clock-display" aria-live="polite">
          <span id="clock-time">--:--:--</span>
        </div>
      </section>

      <section id="timer" class="card">
        <h2>Minuteur</h2>
        <div class="timer-controls">
          <button id="timer-dec" title="-10s" aria-label="Retirer 10 secondes">&#x25C0;</button>
          <input id="timer-input" type="number" min="0" max="3599" value="60" step="1" style="width:70px" aria-label="Saisir le temps en secondes" />
          <button id="timer-inc" title="+10s" aria-label="Ajouter 10 secondes">&#x25B6;</button>
        </div>
        <div class="timer-display">
          <span id="timer-time">01:00</span>
        </div>
        <div class="timer-actions">
          <button id="timer-start">Démarrer</button>
          <button id="timer-stop" disabled>Stopper</button>
        </div>
        <div id="timer-alert" class="timer-alert" style="display:none;color:#c00;font-weight:bold;margin-top:8px"></div>
      </section>

      <section id="stopwatch" class="card">
        <h2>Chronomètre</h2>
        <div class="stopwatch-display">
          <span id="stopwatch-time">00:00.00</span>
        </div>
        <div class="stopwatch-actions">
          <button id="stopwatch-start">Démarrer</button>
          <button id="stopwatch-stop" disabled>Stopper</button>
          <button id="stopwatch-lap" disabled>Tour</button>
          <button id="stopwatch-reset">Reset</button>
        </div>
        <div class="stopwatch-laps">
          <ul id="stopwatch-lap-list"></ul>
        </div>
      </section>

      <section id="alarms" class="card">
        <h2>Réveils</h2>
        <div class="alarms-placeholder">Interface des réveils à implémenter...</div>
      </section>

    </main>
    <script src="js/app.js"></script>
  </body>
</html>
